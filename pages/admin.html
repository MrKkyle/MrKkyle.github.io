<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>window.location.replace('../admin/');</script>
    <title>Redirecting to CMS Admin...</title>
    <link rel="icon" href="../media/logos/main.jpeg" type="image/jpeg" />
    <script>(function(){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var ctx=c.getContext('2d');ctx.beginPath();ctx.arc(s/2,s/2,s/2,0,Math.PI*2);ctx.closePath();ctx.clip();ctx.drawImage(img,0,0,s,s);var link=document.querySelector('link[rel="icon"]');if(!link){link=document.createElement('link');link.rel='icon';document.head.appendChild(link);}link.href=c.toDataURL('image/png');};img.src='../media/logos/main.jpeg';})();</script>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <main class="container">
      <section class="redirect-card">
        <h1>Redirecting to CMS Admin…</h1>
        <p class="redirect-meta">If you are not redirected automatically, click below.</p>
        <div class="redirect-actions">
          <a class="btn btn-primary" href="../admin/">Go to CMS Admin</a>
          <a class="btn btn-soft" href="bible-messages.html">Back to Bible Messages</a>
        </div>
      </section>
    </main>

    <script src="../js/main.js"></script>
  </body>
</html>
