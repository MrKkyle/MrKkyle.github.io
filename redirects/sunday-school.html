<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{var t=localStorage.getItem('mpbc-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}</script>
    <title>Redirecting to Sunday School...</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <main class="container" data-redirect-url="../pages/sunday-school.html" data-redirect-delay="4">
      <section class="redirect-card">
        <h1>Opening Sunday School details...</h1>
        <p class="redirect-meta">
          You will be redirected in <strong id="countdown">4</strong> seconds.
        </p>
        <p class="redirect-meta">If not redirected, open this link:</p>
        <p><a id="targetLink" href="#">../pages/sunday-school.html</a></p>
        <div class="redirect-actions">
          <a class="btn btn-primary" href="../pages/sunday-school.html">Open Now</a>
          <a class="btn btn-soft" href="../index.html">Back Home</a>
        </div>
      </section>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/redirect.js"></script>
  </body>
</html>
