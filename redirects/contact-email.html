<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{var t=localStorage.getItem('mpbc-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}</script>
    <title>Redirecting to Email...</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <main
      class="container"
      data-redirect-url="mailto:office@examplechurch.org"
      data-redirect-delay="3"
    >
      <section class="redirect-card">
        <h1>Opening Your Email App...</h1>
        <p class="redirect-meta">
          We will attempt to open your email client in <strong id="countdown">3</strong> seconds.
        </p>
        <p class="redirect-meta">If it doesn’t open, use this link:</p>
        <p><a id="targetLink" href="#">mailto:office@examplechurch.org</a></p>
        <div class="redirect-actions">
          <a class="btn btn-primary" href="mailto:office@examplechurch.org">Compose Email</a>
          <a class="btn btn-soft" href="../index.html">Back Home</a>
        </div>
      </section>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/redirect.js"></script>
  </body>
</html>
